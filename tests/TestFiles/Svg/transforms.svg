<svg xmlns="http://www.w3.org/2000/svg" width="240" height="140" viewBox="0 0 240 140">
  <defs>
    <path id="arrow" d="M0 -8 L20 0 L0 8 L5 0 Z"/>
  </defs>
  <g transform="translate(30 30)">
    <use href="#arrow" fill="#ef4444"/>
    <use href="#arrow" fill="#f97316" transform="rotate(90)"/>
    <use href="#arrow" fill="#eab308" transform="rotate(180)"/>
    <use href="#arrow" fill="#22c55e" transform="rotate(270)"/>
  </g>
  <rect x="70" y="10" width="40" height="40" fill="#3b82f6" transform="skewX(20)"/>
  <rect x="120" y="10" width="40" height="40" fill="#8b5cf6" transform="skewY(15) translate(0 -20)"/>
  <rect x="180" y="15" width="30" height="30" fill="#ec4899" fill-opacity="0.4"/>
  <rect x="180" y="15" width="30" height="30" fill="#ec4899" transform="rotate(30 195 30)"/>
  <g transform="matrix(1 0 0 -1 0 140)">
    <!-- y 轴翻转：箭头指向下 -->
    <path d="M30 10 L40 40 L20 40 Z" fill="#0d9488"/>
  </g>
  <g transform="translate(120 100) scale(-1 1)">
    <path d="M0 -20 L40 0 L0 20 Z" fill="#64748b"/>
  </g>
  <g transform="translate(150 100)">
    <g transform="scale(1.5)">
      <g transform="rotate(-15)">
        <rect x="0" y="-10" width="40" height="20" rx="5" fill="none" stroke="#111827" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>

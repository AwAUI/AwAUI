<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="140" viewBox="0 0 240 140">
  <defs>
    <linearGradient id="sunset">
      <stop offset="0%" stop-color="#ff512f"/>
      <stop offset="50%" style="stop-color: #f09819"/>
      <stop offset="100%" stop-color="rgb(221, 36, 118)"/>
    </linearGradient>
    <!-- href 继承色标，覆盖方向与单位 -->
    <linearGradient id="vertical" xlink:href="#sunset" x1="0" y1="0" x2="0" y2="1"/>
    <linearGradient id="stripes" href="#sunset" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="30" y2="0" spreadMethod="repeat"/>
    <linearGradient id="mirror" href="#sunset" x2="0.25" spreadMethod="reflect"/>
    <radialGradient id="orb" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="white"/>
      <stop offset="0.35" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1e3a8a" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="squash" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1"
                    gradientTransform="translate(190 100) scale(40 20) rotate(20)">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#16a34a"/>
    </radialGradient>
    <linearGradient id="tint" x1="0" x2="1">
      <stop offset="0" stop-color="currentColor"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="100" height="30" rx="6" fill="url(#sunset)"/>
  <rect x="10" y="50" width="100" height="30" fill="url(#stripes)"/>
  <rect x="10" y="90" width="100" height="30" fill="url(#mirror)"/>
  <rect x="120" y="10" width="20" height="60" fill="url(#vertical)"/>
  <circle cx="185" cy="40" r="30" fill="url(#orb)"/>
  <ellipse cx="190" cy="100" rx="45" ry="30" fill="url(#squash)"/>
  <rect x="120" y="80" width="20" height="50" fill="url(#tint)" stroke="url(#vertical)" stroke-width="3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="200" height="110" viewBox="0 0 200 110">
  <style type="text/css"><![CDATA[
    rect { fill: steelblue; }
    .warn { fill: #f59e0b; stroke: rgb(120, 53, 15); stroke-width: 3px }
    #hero { fill: hsl(340, 82%, 52%) !important }
    g.row > circle { fill: rgba(16, 185, 129, 0.8) }
    svg .outlined circle { fill: none; stroke: darkslategray; stroke-width: 2 }
    /* 不支持的规则被忽略 */
    rect:hover { fill: red }
    @media (prefers-color-scheme: dark) { rect { fill: black } }
  ]]></style>
  <rect x="10" y="10" width="40" height="40"/>
  <rect x="60" y="10" width="40" height="40" class="warn"/>
  <rect id="hero" x="110" y="10" width="40" height="40" fill="green" style="fill: blue"/>
  <rect x="160" y="10" width="30" height="40" style="fill:#a78bfa;stroke:#4c1d95;stroke-width:2;stroke-dasharray:4 2"/>
  <g class="row">
    <circle cx="30" cy="80" r="18"/>
    <circle cx="70" cy="80" r="18" opacity="0.5"/>
  </g>
  <g class="outlined">
    <circle cx="115" cy="80" r="18"/>
  </g>
  <g opacity="0.6">
    <circle cx="160" cy="75" r="16" fill="Crimson"/>
    <circle cx="175" cy="88" r="16" fill="RoyalBlue" stroke="white" stroke-width="2"/>
  </g>
</svg>

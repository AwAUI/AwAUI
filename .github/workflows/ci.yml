name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x
      # 编译全部目标：netstandard2.0 / net8.0 / net10.0（库）与 net10.0 / net11.0（测试；Windows 上另含 net48）
      - run: dotnet build AwAUI.slnx -c Release
      - run: dotnet test AwAUI.slnx -c Release --no-build --logger "console;verbosity=normal"
      # X11 后端的第一次真实运行：在 Xvfb 虚拟显示上打开窗口
      - name: X11 window smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          mkdir -p artifacts
          timeout 60 xvfb-run -a -s "-screen 0 1280x1024x24" dotnet samples/RenderDemo/bin/Release/net10.0/RenderDemo.dll --frames 30 --dump artifacts/x11-frame.png
          test -f artifacts/x11-frame.png
      - name: Upload X11 frame
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: x11-frame
          path: artifacts/x11-frame.png
      # Win32 后端的第一次真实运行：Windows 托管运行器有交互式桌面会话
      - name: Win32 window smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dotnet -ArgumentList 'samples/RenderDemo/bin/Release/net10.0/RenderDemo.dll','--frames','30','--dump','artifacts/win32-frame.png' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'RenderDemo did not finish 30 frames within 60 s' }
          if ($p.ExitCode -ne 0) { throw "RenderDemo exited with $($p.ExitCode)" }
          if (-not (Test-Path artifacts/win32-frame.png)) { throw 'No frame was dumped' }
      - name: Upload Win32 frame
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: win32-frame
          path: artifacts/win32-frame.png
      - name: Upload golden image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-${{ matrix.os }}
          path: tests/TestFiles/Output/

  aot-smoke:
    name: NativeAOT smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      # 发布时裁剪/AOT 警告即错误
      - run: dotnet publish samples/RenderDemo -c Release -r osx-arm64 -p:NativeAot=true -p:TreatWarningsAsErrors=true -o artifacts/aot
      - run: ./artifacts/aot/RenderDemo --headless artifacts/aot/frame.png
      - uses: actions/upload-artifact@v4
        with:
          name: aot-frame
          path: artifacts/aot/frame.png
